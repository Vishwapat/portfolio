name: Bug report
description: Something on the site is broken or looks wrong.
title: "fix: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this.
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://vishwapat.vercel.app/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      multiple: true
      options: [Safari (iOS), Safari (macOS), Chrome, Firefox, Edge, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: iPhone 15 Pro, iOS 26
